<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackboard lectures · Ohmmade Breadboard</title>
<link rel="stylesheet" href="fonts/fonts.css?v=d6131645">
<link rel="stylesheet" href="game/game.css?v=9c5b56e4">
<style>
  /* A review page: every blackboard lecture, board by board, with Sparky's line and its length. */
  html, body { height: auto; }
  body { overflow: auto; padding: 24px 16px 60px; }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font: 600 30px var(--font-display); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  nav a { color: var(--lamp); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; text-decoration: none; font: 600 14px var(--font-display); }
  section.lec { margin: 0 0 34px; }
  section.lec h2 { font: 600 24px var(--font-display); margin: 0 0 2px; }
  section.lec .where { color: var(--muted); margin: 0 0 10px; }
  .boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .bd { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  .bd .pic { background: #26382f; border: 8px solid #7a5332; border-radius: 10px 10px 0 0; aspect-ratio: 220 / 130; }
  .bd .pic svg { width: 100%; height: 100%; display: block; }
  .bd p { margin: 0; padding: 10px 12px 4px; font: 16px/1.35 var(--font-body); color: var(--ink); }
  .bd .meta { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px 10px; color: var(--muted); font-size: 12px; }
  .bd .meta .long { color: var(--warn); font-weight: 600; }
  .bd button { background: transparent; color: var(--lamp); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; font: 600 12px var(--font-display); }
</style>
</head>
<body>
<main>
  <h1>Sparky's blackboard lectures</h1>
  <p class="sub">What "I don't get it" shows, board by board: the chalk picture, Sparky's line (at most 140 characters) and what a screen reader says about the picture. Replay draws a picture again.</p>
  <nav id="nav"></nav>
  <div id="all"></div>
</main>
<script src="game/concepts.js?v=93cb2633"></script>
<script src="game/levels/ch1.js?v=b58d0dc7"></script>
<script src="game/levels/ch2.js?v=0e36d2aa"></script>
<script src="game/levels/ch3.js?v=65e53c11"></script>
<script src="game/levels/ch4.js?v=0a366d69"></script>
<script src="game/levels/ch5.js?v=bbeda554"></script>
<script src="game/levels/ch6.js?v=4798837a"></script>
<script src="game/levels/ch7.js?v=7885111d"></script>
<script src="game/levels/ch8.js?v=a8bf4163"></script>
<script src="game/levels/ch9.js?v=49b2cbbf"></script>
<script src="game/levels/ch10.js?v=05f20e2a"></script>
<script src="game/levels/ch11.js?v=f754bbd0"></script>
<script src="game/notebook-art.js?v=fa642c86"></script>
<script src="game/chalk-art.js?v=eb4a5507"></script>
<script src="game/lectures.js?v=4d8b75fb"></script>
<script>
(function () {
  "use strict";
  const esc = (s) => { const n = document.createElement("span"); n.textContent = s; return n.innerHTML; };
  const levels = (BB.Levels && BB.Levels.all ? BB.Levels.all() : []);
  const nav = document.getElementById("nav"), all = document.getElementById("all");
  for (const L of BB.Lectures.LIST) {
    const c = BB.Concepts.get(L.id) || { name: L.id };
    const where = levels.filter((l) => (l.teaches || []).includes(L.id)).map((l) => `${l.id} ${l.title}`).join(", ");
    nav.insertAdjacentHTML("beforeend", `<a href="#lec-${L.id}">${esc(c.name)}</a>`);
    const sec = document.createElement("section");
    sec.className = "lec"; sec.id = `lec-${L.id}`;
    sec.innerHTML = `<h2>${esc(c.name)}</h2><p class="where">Taught in ${esc(where || "—")}. Notebook card: ${esc(c.text || "")}</p><div class="boards"></div>`;
    const grid = sec.querySelector(".boards");
    L.slides.forEach((s, k) => {
      const n = s.say.length, bd = document.createElement("div");
      bd.className = "bd";
      bd.innerHTML = `<div class="pic" role="img" aria-label="${esc(s.alt)}">${BB.ChalkArt.board(s.art)}</div><p>${esc(s.say)}</p>` +
        `<div class="meta"><span>${k + 1}/${L.slides.length} · ${s.kind} · ${esc(s.art)} · <span class="${n > 140 ? "long" : ""}">${n} chars</span></span><button type="button">Replay</button></div>`;
      bd.querySelector("button").addEventListener("click", () => { const pic = bd.querySelector(".pic"); pic.innerHTML = BB.ChalkArt.board(s.art); BB.ChalkArt.animate(pic); });
      grid.appendChild(bd);
    });
    all.appendChild(sec);
  }
})();
</script>
</body>
</html>
