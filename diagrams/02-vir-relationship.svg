<text font-size="18" fill="#b91c1c" text-anchor="middle"><tspan x="910.0" y="810.0">A wire has R ≈ 0, so I is huge:</tspan><tspan x="910.0" y="832.5">a short circuit. Never do this.</tspan></text>
