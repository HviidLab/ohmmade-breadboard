<text font-size="44" fill="#b45309" text-anchor="start"><tspan x="890.0" y="374.6">I</tspan></text>
<text font-size="44" fill="#0e7490" text-anchor="start"><tspan x="998.0" y="374.6">R</tspan></text>
<text font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="794.0" y="461.2">Cover the one you want:</tspan><tspan x="794.0" y="483.7">V = I × R  ·  I = V / R  ·  R = V / I</tspan></text>
