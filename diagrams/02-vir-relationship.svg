<text font-size="22" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="198.9">VOLTAGE (V)</tspan><tspan x="190.0" y="226.4">the push</tspan></text>
<rect x="60.0" y="380.0" width="260.0" height="110.0" rx="12.0" fill="#c3fae8" stroke="#0e9fb5" stroke-width="2"/>
<text font-size="22" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="428.9">RESISTANCE (Ω)</tspan><tspan x="190.0" y="456.4">the limit</tspan></text>
<rect x="520.0" y="260.0" width="260.0" height="120.0" rx="12.0" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
<text font-size="22" fill="#1e1e1e" text-anchor="middle"><tspan x="650.0" y="313.9">CURRENT (A)</tspan><tspan x="650.0" y="341.4">the result</tspan></text>
