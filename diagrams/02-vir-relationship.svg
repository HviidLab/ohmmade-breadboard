<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="36" y="-14" width="1148" height="898" fill="#ffffff"/>
<text font-size="32" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="38.8">Voltage, current and resistance</tspan></text>
<text font-size="18" fill="#5c6670" text-anchor="start"><tspan x="344.0" y="72.2">Voltage pushes. Resistance limits. Current is the result.</tspan></text>
