<polyline points="990.0,232.0 1080.0,232.0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#h)"/>
<polyline points="990.0,352.0 1080.0,352.0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#h)"/>
<polyline points="1000.0,645.0 820.0,645.0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#h)"/>
<text font-size="18" fill="#b45309" text-anchor="start"><tspan x="852.0" y="671.2">24.2 mA total</tspan></text>
<text font-size="20" fill="#b45309" text-anchor="start"><tspan x="650.0" y="730.0">Currents add up:</tspan><tspan x="650.0" y="755.0">18.2 mA + 6.0 mA = 24.2 mA</tspan></text>
<text font-size="20" fill="#6d28d9" text-anchor="start"><tspan x="650.0" y="802.0">Same voltage across each part.</tspan><tspan x="650.0" y="827.0">Total R = 248 Ω (less than 330 Ω)</tspan></text>
