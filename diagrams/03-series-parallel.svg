<text font-size="20" fill="#6d28d9" text-anchor="start"><tspan x="50.0" y="658.0">Voltages add up:</tspan><tspan x="50.0" y="683.0">1.49 V + 4.51 V = 6 V</tspan></text>
<text font-size="20" fill="#0e7490" text-anchor="start"><tspan x="50.0" y="730.0">Resistances add up:</tspan><tspan x="50.0" y="755.0">330 Ω + 1000 Ω = 1330 Ω</tspan></text>
<text font-size="20" fill="#b45309" text-anchor="start"><tspan x="50.0" y="802.0">Current: 6 V ÷ 1330 Ω</tspan><tspan x="50.0" y="827.0">= 4.51 mA</tspan></text>
