<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="918" viewBox="-4 -14 1208 918" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="-4" y="-14" width="1208" height="918" fill="#ffffff"/>
<text font-size="32" fill="#1e1e1e" text-anchor="start"><tspan x="448.0" y="38.8">Series and parallel</tspan></text>
<text font-size="18" fill="#5c6670" text-anchor="start"><tspan x="339.0" y="72.2">Same parts, 6 V, 330 Ω and 1 kΩ. Two ways to connect them.</tspan></text>
