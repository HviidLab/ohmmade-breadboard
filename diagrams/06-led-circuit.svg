<text font-size="20" fill="#b45309" text-anchor="start"><tspan x="50.0" y="718.0">Current = 4 V ÷ 330 Ω = 12.1 mA</tspan></text>
<text font-size="20" fill="#0e7490" text-anchor="start"><tspan x="50.0" y="768.0">Choose R for the current you want:</tspan><tspan x="50.0" y="793.0">R = (6 − 2) V ÷ 0.012 A ≈ 330 Ω</tspan></text>
